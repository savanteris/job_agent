name: Run Daily Job Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

# Dodane wymagane uprawnienia zapisu dla repozytorium
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python job_agent_email.py

      - name: Save seen offers state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update seen offers"
