name: Daily Job Agent Digest

on:
  schedule:
    # Uruchamia się codziennie o 8:00 UTC (10:00 czasu polskiego)
    - cron: '0 8 * * *'
  workflow_dispatch: # Przycisk "Run workflow" do ręcznego testowania

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Run Job Agent script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python job_agent_email.py

      - name: Commit and push seen_offers.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_offers.json || true
          git commit -m "Update seen offers list" || true
          git push || true
